<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>MERAMAI Coffee & Eatery</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      scroll-behavior:smooth;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f8f6f1;
      color:#111;
      overflow-x:hidden;
    }

    img{
      width:100%;
      display:block;
    }

    /* SCROLLBAR */

    ::-webkit-scrollbar{
      width:8px;
    }

    ::-webkit-scrollbar-thumb{
      background:#c8a96b;
      border-radius:20px;
    }

    /* POPUP */

    #popup{
      position:fixed;
      inset:0;
      background:rgba(255,255,255,0.75);
      backdrop-filter:blur(10px);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:9999;
      animation:fadeIn 1s;
    }

    .popup-box{
      width:90%;
      max-width:430px;
      background:white;
      border:1px solid rgba(200,169,107,0.18);
      border-radius:38px;
      padding:45px 35px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,0.08);
      animation:popupUp 1s;
    }

    .popup-logo{
      width:120px;
      margin:auto;
      margin-bottom:25px;
    }

    .popup-title{
      font-size:36px;
      letter-spacing:5px;
      margin-bottom:14px;
      color:#111;
    }

    .popup-text{
      color:#9a7b47;
      line-height:1.8;
      margin-bottom:30px;
    }

    .popup-btn{
      border:none;
      background:linear-gradient(135deg,#c8a96b,#e2c48b);
      color:white;
      padding:15px 34px;
      border-radius:999px;
      cursor:pointer;
      transition:0.35s;
      font-size:15px;
      box-shadow:0 12px 25px rgba(200,169,107,0.25);
    }

    .popup-btn:hover{
      transform:translateY(-3px);
    }

    /* HERO */

    .hero{
      height:100vh;
      position:relative;
      overflow:hidden;
    }

    .hero-bg{
      width:100%;
      height:100vh;
      object-fit:cover;
      filter:brightness(0.55);
      transform:scale(1.05);
      animation:zoomHero 12s infinite alternate;
    }

    .hero-overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(to bottom,
      rgba(255,255,255,0.05),
      rgba(0,0,0,0.55));
    }

    .hero-content{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      padding:20px;
      z-index:2;
    }

    .hero-logo{
      width:500px;
      max-width:90%;
      margin-bottom:25px;
      animation:fadeUp 1.5s;
    }

    .hero-subtitle{
      color:#f0dcb1;
      font-size:18px;
      margin-bottom:35px;
      animation:fadeUp 2s;
    }

    .hero-buttons{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      justify-content:center;
      animation:fadeUp 2.5s;
    }

    .hero-buttons a{
      text-decoration:none;
      color:white;
      padding:15px 28px;
      border-radius:999px;
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.15);
      backdrop-filter:blur(8px);
      transition:0.35s;
      box-shadow:0 10px 25px rgba(0,0,0,0.12);
    }

    .hero-buttons a:hover{
      background:white;
      color:#111;
      transform:translateY(-3px);
    }

    /* SECTION */

    .section{
      max-width:1350px;
      margin:auto;
      padding:110px 24px;
    }

    .section-title{
      text-align:center;
      font-size:46px;
      color:#b89255;
      margin-bottom:65px;
      position:relative;
      font-weight:600;
    }

    .section-title::after{
      content:"";
      width:90px;
      height:3px;
      background:#d5b378;
      display:block;
      margin:18px auto 0;
      border-radius:20px;
    }

    /* GALLERY */

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:28px;
    }

    .gallery img{
      height:420px;
      object-fit:cover;
      border-radius:32px;
      box-shadow:0 18px 45px rgba(0,0,0,0.08);
      transition:0.4s;
      border:1px solid rgba(200,169,107,0.12);
    }

    .gallery img:hover{
      transform:translateY(-8px) scale(1.02);
    }

    /* CARD */

    .card{
      width:100%;
      max-width:950px;
      margin:auto;
      background:white;
      border-radius:38px;
      overflow:hidden;
      box-shadow:0 18px 55px rgba(0,0,0,0.06);
      border:1px solid rgba(200,169,107,0.1);
      transition:0.35s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    /* FOOTER */

    footer{
      background:white;
      padding:100px 24px;
      text-align:center;
      border-top:1px solid rgba(200,169,107,0.12);
    }

    .footer-logo{
      width:90px;
      margin:auto;
      margin-bottom:30px;
    }

    .footer-title{
      font-size:34px;
      letter-spacing:5px;
      color:#b89255;
      margin-bottom:14px;
    }

    .footer-sub{
      color:#777;
      line-height:1.8;
      margin-bottom:40px;
    }

    .footer-buttons{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .footer-buttons a{
      text-decoration:none;
      color:#111;
      padding:14px 24px;
      border-radius:999px;
      border:1px solid rgba(200,169,107,0.18);
      transition:0.35s;
      background:#fff;
      box-shadow:0 10px 25px rgba(0,0,0,0.04);
    }

    .footer-buttons a:hover{
      background:#c8a96b;
      color:white;
      transform:translateY(-3px);
    }

    .copyright{
      margin-top:40px;
      color:#999;
      font-size:14px;
    }

    /* ANIMATION */

    @keyframes fadeIn{
      from{opacity:0;}
      to{opacity:1;}
    }

    @keyframes popupUp{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes zoomHero{
      from{
        transform:scale(1.05);
      }
      to{
        transform:scale(1.12);
      }
    }

    /* MOBILE */

    @media(max-width:768px){

      .section-title{
        font-size:34px;
      }

      .gallery img{
        height:300px;
      }

      .popup-title{
        font-size:30px;
      }

    }

  </style>
</head>

<body>

  <script>

    function closePopup(){

</body>

</html>
