<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MERAMAI Coffee & Eatery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8f6f1;
      color: #111;
    }

    .hero {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      text-align: center;
    }

    .hero img {
      width: 100%;
      max-width: 500px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      margin-bottom: 30px;
    }

    h1 {
      font-size: 42px;
      letter-spacing: 5px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #8d6b2f;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .buttons a {
      text-decoration: none;
      background: #111;
      color: white;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: bold;
      transition: 0.3s;
    }

    .buttons a:hover {
      opacity: 0.8;
    }

    .section {
      max-width: 1200px;
      margin: auto;
      padding: 60px 20px;
    }

    .section-title {
      text-align: center;
      font-size: 36px;
      margin-bottom: 40px;
      color: #8d6b2f;
    }

    .menu-card {
      background: white;
      border-radius: 25px;
      overflow: hidden;
      margin-bottom: 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .menu-card img {
      width: 100%;
      display: block;
    }

    footer {
      text-align: center;
      padding: 50px 20px;
      color: #666;
      font-size: 14px;
    }

    .footer-title {
      font-size: 24px;
      margin-bottom: 10px;
      color: #8d6b2f;
    }

    @media (max-width: 768px) {

      h1 {
        font-size: 32px;
      }

      .section-title {
        font-size: 28px;
      }

    }
  </style>
</head>

<body>

  <!-- HERO -->

  <section class="hero">

    <img src="1.-Cover.jpg" alt="MERAMAI Cover">

    <h1>MERAMAI</h1>

    <p class="subtitle">
      Coffee & Eatery
    </p>

    <div class="buttons">
      <a href="#">WhatsApp</a>
      <a href="#">Instagram</a>
      <a href="#">Maps</a>
    </div>

  </section>


  <!-- ABOUT -->

  <section class="section">

    <h2 class="section-title">
      About Us
    </h2>

    <div class="menu-card">
      <img src="2.-About-Us.jpg" alt="">
    </div>

  </section>


  <!-- FOOD -->

  <section class="section">

    <h2 class="section-title">
      Food Series
    </h2>

    <div class="menu-card">
      <img src="3.-Food-Series.jpg" alt="">
    </div>

    <div class="menu-card">
      <img src="4.-Food-Series-Menu-1.jpg" alt="">
    </div>

    <div class="menu-card">
      <img src="5.-Food-Series-Menu-2.jpg" alt="">
    </div>

    <div class="menu-card">
      <img src="6.-Food-Series-Menu-3.jpg" alt="">
    </div>

  </section>


  <!-- SNACK -->

  <section class="section">

    <h2 class="section-title">
      Snack Series
    </h2>

    <div class="menu-card">
      <img src="7.-Snack-Series.jpg" alt="">
    </div>

    <div class="menu-card">
      <img src="8.-Snack-Series-Menu-1.jpg" alt="">
    </div>

    <div class="menu-card">
      <img src="9.-Snack-Series-Menu-2.jpg" alt="">
    </div>

    <div class="menu-card">
      <img src="10.-Snack-Series-Menu-3.jpg" alt="">
    </div>

  </section>


  <!-- COFFEE -->

  <section class="section">

    <h2 class="section-title">
      Coffee Series
    </h2>

    <div class="menu-card">
      <img src="11.-Coffee-Series.jpg" alt="">
    </div>

    <div class="menu-card">
      <img src="12.-Coffee-Series-Menu-1.jpg" alt="">
    </div>

  </section>


  <!-- NON COFFEE -->

  <section class="section">

    <h2 class="section-title">
      Non Coffee Series
    </h2>

    <div class="menu-card">
      <img src="13.-Non-Coffee-Series.jpg" alt="">
    </div>

    <div class="menu-card">
      <img src="14.-Non-Coffee-Series-Menu-1.jpg" alt="">
    </div>

  </section>


  <!-- CLOSING -->

  <section class="section">

    <div class="menu-card">
      <img src="15.-Closing-Page.jpg" alt="">
    </div>

  </section>


  <!-- FOOTER -->

  <footer>

    <div class="footer-title">
      MERAMAI Coffee & Eatery
    </div>

    Cirebon, Indonesia

  </footer>

</body>

</html>
