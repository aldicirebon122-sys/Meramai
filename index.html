<!-- ========================= -->
<!-- FLIPBOOK MENU SECTION -->
<!-- ========================= -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip/dist/css/page-flip.css"/>

<style>

.flipbook-section{
  padding:120px 20px;
  background:#f8f6f1;
}

.flipbook-title{
  text-align:center;
  font-size:48px;
  color:#b89255;
  margin-bottom:60px;
  letter-spacing:3px;
}

#flipbook{
  width:100%;
  max-width:1000px;
  height:700px;
  margin:auto;
}

.page{
  background:white;
  overflow:hidden;
  border-radius:10px;
}

.page img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.page-cover{
  background:#111;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px;
}

.page-cover img{
  width:180px;
  margin-bottom:30px;
}

.page-cover h1{
  font-size:52px;
  margin-bottom:20px;
  letter-spacing:4px;
}

.page-cover p{
  color:#d6b57a;
  line-height:1.8;
  max-width:500px;
}

@media(max-width:768px){

  #flipbook{
    height:520px;
  }

  .page-cover h1{
    font-size:34px;
  }

}

</style>

<section class="flipbook-section">

  <div class="flipbook-title">
    Digital Menu Book
  </div>

  <div id="flipbook">

    <!-- COVER -->

    <div class="page page-cover">

      <img src="Logo-Meramai1.png">

      <h1>MERAMAI</h1>

      <p>
        Coffee & Eatery<br><br>

        Tempat dimana kopi,
        suasana, dan cerita
        bertemu menjadi satu.
      </p>

    </div>

    <!-- ABOUT -->

    <div class="page">
      <img src="2.-About-Us.jpg">
    </div>

    <!-- FOOD -->

    <div class="page">
      <img src="3.-Food-Series.jpg">
    </div>

    <div class="page">
      <img src="4.-Food-Series-Menu-1.jpg">
    </div>

    <div class="page">
      <img src="5.-Food-Series-Menu-2.jpg">
    </div>

    <div class="page">
      <img src="6.-Food-Series-Menu-3.jpg">
    </div>

    <!-- SNACK -->

    <div class="page">
      <img src="7.-Snack-Series.jpg">
    </div>

    <div class="page">
      <img src="8.-Snack-Series-Menu-1.jpg">
    </div>

    <div class="page">
      <img src="9.-Snack-Series-Menu-2.jpg">
    </div>

    <div class="page">
      <img src="10.-Snack-Series-Menu-3.jpg">
    </div>

    <!-- COFFEE -->

    <div class="page">
      <img src="11.-Coffee-Series.jpg">
    </div>

    <div class="page">
      <img src="12.-Coffee-Series-Menu-1.jpg">
    </div>

    <!-- NON COFFEE -->

    <div class="page">
      <img src="13.-Non-Coffee-Series.jpg">
    </div>

    <div class="page">
      <img src="14.-Non-Coffee-Series-Menu-1.jpg">
    </div>

    <!-- CLOSING -->

    <div class="page">
      <img src="15.-Closing-Page.jpg">
    </div>

  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<script>

const pageFlip = new St.PageFlip(
  document.getElementById("flipbook"),
  {
    width:500,
    height:700,
    size:"stretch",
    minWidth:315,
    maxWidth:1000,
    minHeight:420,
    maxHeight:1350,
    maxShadowOpacity:0.5,
    showCover:true,
    mobileScrollSupport:true
  }
);

pageFlip.loadFromHTML(document.querySelectorAll(".page"));

</script>
