<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MERAMAI Coffee & Eatery</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
overflow-x:hidden;
background:#f8f5ef;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
max-width:430px;
margin:auto;
background:#f8f5ef;
}

/* ================= NAVBAR ================= */

.navbar{
position:fixed;
top:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:430px;
padding:14px 18px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:999;
background:rgba(255,255,255,.78);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(201,161,93,.15);
}

.logo{
width:34px;
height:34px;
object-fit:contain;
}

.nav-links{
display:flex;
gap:14px;
}

.nav-links a{
text-decoration:none;
font-size:13px;
font-weight:500;
color:#b8924f;
}

/* ================= HERO ================= */

.hero{
position:relative;
height:100vh;
overflow:hidden;
background:#f8f5ef;
}

.hero img{
position:absolute;
bottom:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
opacity:.22;
}

.hero-content{
position:relative;
z-index:2;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:0 28px;
}

.hero-title{
font-family:'Cormorant Garamond',serif;
font-size:58px;
line-height:0.9;
letter-spacing:2px;
color:#c9a15d;
margin-bottom:14px;
}

.hero-sub{
font-family:'Cormorant Garamond',serif;
font-size:22px;
letter-spacing:5px;
color:#8f7443;
margin-bottom:34px;
}

.hero-text{
font-size:17px;
line-height:2;
color:#6e6e6e;
max-width:330px;
}

/* ================= SECTION ================= */

.section{
padding:70px 22px;
background:#f8f5ef;
}

.section-title{
text-align:center;
margin-bottom:38px;
}

.section-title span{
font-size:12px;
letter-spacing:4px;
color:#c8a15d;
}

.section-title h2{
font-family:'Cormorant Garamond',serif;
font-size:40px;
margin-top:8px;
color:#c8a15d;
}

<!-- ================= ABOUT ================= -->

<section id="tentang">

<p class="section-sub">TENTANG</p>

<h2 class="section-title">MERAMAI</h2>

<div class="about">

<img src="2.-About-Us.jpg">

<div class="about-text">

<h3>Meramai Coffee & Eatery</h3>

<p>
Tempat di mana rasa, suasana, dan cerita bertemu dalam satu meja.
Kami hadir memberikan pengalaman bersantai yang hangat, nyaman,
dan elegan untuk setiap momen bersama keluarga, teman, maupun rekan kerja.
</p>

</div>

</div>
