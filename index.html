<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>MERAMAI Coffee & Eatery</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      scroll-behavior:smooth;
      font-family:Arial,sans-serif;
    }

    html,
    body{
      overflow-x:hidden;
      overflow-y:auto;
      background:#faf8f4;
      color:#111;
    }

    img{
      width:100%;
      display:block;
    }

    ::-webkit-scrollbar{
      width:8px;
    }

    ::-webkit-scrollbar-thumb{
      background:#d2b073;
      border-radius:20px;
    }

    /* POPUP */

    #popup{
      position:fixed;
      inset:0;
      background:rgba(255,255,255,0.72);
      backdrop-filter:blur(12px);

      display:flex;
      justify-content:center;
      align-items:center;

      z-index:9999;

      animation:fadeIn 1s;
    }

    .popup-box{

      width:90%;
      max-width:410px;

      background:white;

      border-radius:38px;

      padding:48px 35px;

      text-align:center;

      box-shadow:
      0 20px 60px rgba(0,0,0,0.08);

      animation:popupUp 1s;
    }

    .popup-logo{
      width:120px;
      margin:auto;
      margin-bottom:25px;
    }

    .popup-title{
      font-size:36px;
      letter-spacing:4px;
      margin-bottom:14px;
    }

    .popup-text{
      color:#a27d45;
      line-height:1.9;
      margin-bottom:34px;
      font-size:15px;
    }

    .popup-btn{

      border:none;

      background:
      linear-gradient(135deg,#c8a96b,#e1c58f);

      color:white;

      padding:15px 34px;

      border-radius:999px;

      cursor:pointer;

      transition:0.35s;

      font-size:15px;

      box-shadow:
      0 10px 25px rgba(200,169,107,0.22);
    }

    .popup-btn:hover{
      transform:translateY(-3px);
    }

    /* HERO */

    .hero{
      position:relative;
      min-height:100vh;
    }

    .hero-bg{

      width:100%;
      min-height:100vh;

      object-fit:cover;

      animation:
      zoomHero 12s infinite alternate;
    }

    .hero-overlay{

      position:absolute;
      inset:0;

      background:
      linear-gradient(
      to bottom,
      rgba(0,0,0,0.18),
      rgba(0,0,0,0.48));
    }

    .hero-content{

      position:absolute;
      inset:0;

      z-index:2;

      display:flex;
      flex-direction:column;

      justify-content:center;
      align-items:center;

      text-align:center;

      padding:40px 24px;

      color:white;
    }

    /* LOGO */

    .hero-logo{

      width:190px;

      margin-bottom:20px;

      object-fit:contain;

      animation:fadeUp 1.4s;

      filter:
      drop-shadow(
      0 12px 25px rgba(0,0,0,0.25));
    }

    /* TITLE */

    .hero-title{

      font-size:78px;

      font-weight:700;

      letter-spacing:10px;

      margin-bottom:12px;

      text-shadow:
      0 10px 30px rgba(0,0,0,0.25);

      animation:fadeUp 1.8s;
    }

    /* DESC */

    .hero-desc{

      color:#f6e3bd;

      line-height:2;

      font-size:18px;

      max-width:650px;

      margin-bottom:42px;

      animation:fadeUp 2.2s;
    }

    /* BUTTON */

    .hero-buttons{

      display:flex;

      gap:16px;

      flex-wrap:wrap;

      justify-content:center;

      animation:fadeUp 2.6s;
    }

    .hero-buttons a{

      text-decoration:none;

      color:white;

      padding:15px 30px;

      border-radius:999px;

      background:rgba(255,255,255,0.12);

      border:1px solid rgba(255,255,255,0.15);

      backdrop-filter:blur(12px);

      transition:0.35s;

      box-shadow:
      0 10px 25px rgba(0,0,0,0.14);

      font-size:15px;

      min-width:145px;
    }

    .hero-buttons a:hover{

      background:white;

      color:#111;

      transform:
      translateY(-4px)
      scale(1.03);
    }

    /* SECTION */

    .section{
      max-width:1350px;
      margin:auto;
      padding:120px 24px;
    }

    .section-title{

      text-align:center;

      font-size:46px;

      color:#bc9454;

      margin-bottom:70px;

      font-weight:600;
    }

    .section-title::after{

      content:"";

      width:90px;
      height:3px;

      background:#d8b77c;

      display:block;

      margin:18px auto 0;

      border-radius:20px;
    }

    /* GALLERY */

    .gallery{

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(280px,1fr));

      gap:30px;
    }

    .gallery img{

      height:430px;

      object-fit:cover;

      border-radius:34px;

      box-shadow:
      0 20px 50px rgba(0,0,0,0.08);

      transition:0.4s;
    }

    .gallery img:hover{

      transform:
      translateY(-8px)
      scale(1.02);
    }

    /* ABOUT */

    .about-card{

      width:100%;
      max-width:950px;

      margin:auto;

      background:white;

      border-radius:38px;

      overflow:hidden;

      box-shadow:
      0 18px 55px rgba(0,0,0,0.06);
    }

    /* MENU */

    .menu-wrapper{

      display:flex;
      flex-direction:column;

      gap:35px;

      max-width:950px;

      margin:auto;
    }

    .menu-card{

      background:white;

      border-radius:38px;

      overflow:hidden;

      box-shadow:
      0 18px 55px rgba(0,0,0,0.06);

      transition:0.35s;
    }

    .menu-card:hover{
      transform:translateY(-6px);
    }

    /* FOOTER */

    footer{

      background:white;

      padding:110px 24px;

      text-align:center;

      border-top:
      1px solid rgba(200,169,107,0.12);
    }

    .footer-logo{

      width:90px;

      margin:auto;

      margin-bottom:28px;
    }

    .footer-title{

      font-size:34px;

      color:#bc9454;

      letter-spacing:5px;

      margin-bottom:16px;
    }

    .footer-desc{

      color:#777;

      line-height:2;

      margin-bottom:40px;
    }

    .footer-buttons{

      display:flex;

      justify-content:center;

      gap:15px;

      flex-wrap:wrap;
    }

    .footer-buttons a{

      text-decoration:none;

      color:#111;

      padding:14px 24px;

      border-radius:999px;

      border:
      1px solid rgba(200,169,107,0.18);

      transition:0.35s;

      background:white;

      box-shadow:
      0 10px 25px rgba(0,0,0,0.04);
    }

    .footer-buttons a:hover{

      background:#c8a96b;

      color:white;

      transform:translateY(-3px);
    }

    .copyright{

      margin-top:42px;

      color:#999;

      font-size:14px;
    }

    /* ANIMATION */

    @keyframes fadeIn{
      from{opacity:0;}
      to{opacity:1;}
    }

    @keyframes popupUp{

      from{
        opacity:0;
        transform:translateY(40px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes fadeUp{

      from{
        opacity:0;
        transform:translateY(40px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes zoomHero{

      from{
        transform:scale(1.05);
      }

      to{
        transform:scale(1.12);
      }
    }

    /* MOBILE */

    @media(max-width:768px){

      .hero-logo{
        width:145px;
      }

      .hero-title{

        font-size:48px;

        letter-spacing:5px;
      }

      .hero-desc{

        font-size:15px;

        line-height:1.9;
      }

      .hero-buttons a{

        min-width:130px;

        padding:14px 22px;
      }

      .section-title{
        font-size:34px;
      }

      .gallery img{
        height:300px;
      }

    }

  </style>

</head>
